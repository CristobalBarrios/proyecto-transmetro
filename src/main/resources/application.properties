spring.application.name=transmetro-operativo
server.port=${PORT:8080}
server.tomcat.max-connections=25
server.tomcat.accept-count=10
server.tomcat.threads.max=10
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=5s
server.tomcat.max-keep-alive-requests=20
server.servlet.session.timeout=30m
spring.datasource.url=${TRANSMETRO_DB_URL:jdbc:postgresql://localhost:5432/transmetro_operativo}
spring.datasource.username=${TRANSMETRO_DB_USER:postgres}
spring.datasource.password=${TRANSMETRO_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
