<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Líneas | Transmetro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="brand-mark">TM</div>
    <div><p class="eyebrow">Sistema de control operativo</p><h1>Transmetro</h1></div>
  </header>
  <main>
    <section class="intro"><p class="eyebrow">Demostración funcional</p><h2>Registro de líneas.</h2><p>Consulte las líneas existentes y agregue una nueva línea para la municipalidad de demostración.</p></section>
    <section class="workspace">
      <div class="panel"><div class="panel-heading"><div><p class="eyebrow">Entidad</p><h3>Líneas registradas</h3></div></div><div id="lineas-list" class="rows"></div></div>
      <form id="linea-form" class="panel form-panel"><div class="panel-heading"><div><p class="eyebrow">Acción</p><h3>Agregar línea</h3></div></div><label>Código<input name="codigo" maxlength="20" placeholder="LÍNEA-02" required></label><label>Nombre<input name="nombre" maxlength="120" placeholder="Nombre de la línea" required></label><button class="button">Guardar línea</button></form>
    </section>
  </main>
  <p id="notice" class="notice" role="status"></p>
  <script src="app.js"></script>
</body>
</html>
